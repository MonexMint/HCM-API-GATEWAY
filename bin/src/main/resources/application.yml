# ===================================================================
# HCM Gateway Application - Single-file Configuration
# All environments are driven by env-var overrides below (no Spring
# profiles / no application-dev.yml / application-uat.yml / application-prod.yml).
# Defaults shown here are the local-dev values.
# ===================================================================

spring:
  application:
    name: HcmGatewayApplication
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            - id: hcm-platform-plans
              uri: lb://HCMAUTHSERVICE
              predicates:
                - Path=/api/platform/plans
              filters:
                - StripPrefix=0
              order: -1
            - id: hcm-employee-helpdesk
              uri: lb://HCMEMPLOYEESERVICE
              predicates:
                - Path=/api/tenant/helpdesk/**
              filters:
                - StripPrefix=0
              order: -1
            - id: hcm-recruitment-service
              uri: lb://HCMRECRUITMENTSERVICE
              predicates:
                - 'Path=/api/recruitment/**'
              filters:
                - StripPrefix=0
              order: -1
            - id: hcm-recruitment-me-career
              uri: lb://HCMRECRUITMENTSERVICE
              predicates:
                - Path=/api/me/career/**
              filters:
                - StripPrefix=0
              order: -1
            - id: hcm-auth-service
              uri: lb://HCMAUTHSERVICE
              predicates:
                - 'Path=/api/auth/**,/api/billing/**,/api/platform/**,/api/tenant/**,/api/payments/**'
              filters:
                - StripPrefix=0
            - id: hcm-employee-service
              uri: lb://HCMEMPLOYEESERVICE
              predicates:
                - 'Path=/api/employees/**,/api/attendance/**,/api/leave/**,/api/payroll/**,/api/compensation/**,/api/documents/**,/api/company-policies/**,/api/pre-employees/**,/api/me/**,/api/signatures/**,/api/exits/**,/api/performance/**,/api/learning/**,/api/engagement/**,/api/travel/**,/api/webhooks/**,/api/ai/**,/api/inbox/**,/api/analytics/**,/api/public/pre-onboarding/**'
              filters:
                - StripPrefix=0
            - id: hcm-employee-adms
              uri: lb://HCMEMPLOYEESERVICE
              predicates:
                - Path=/iclock/**
              filters:
                - StripPrefix=0
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                # Env-driven origin patterns (comma-separated). Defaults cover
                # local dev across all four hosts: marketing, platform,
                # tenant workspaces (*.localhost) and public portals
                # (*.jobs.localhost). Prod/UAT override via CORS_ALLOWED_ORIGIN_PATTERNS.
                allowedOriginPatterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://superadmin.localhost:3000,http://*.localhost:3000,http://*.jobs.localhost:3000}
                allowedMethods: "*"
                allowedHeaders:
                  - "Authorization"
                  - "Content-Type"
                  - "X-Tenant-Subdomain"
                  - "X-Entry-Point"
                  - "X-Tenant-Id"
                  - "Accept"
                  - "Origin"
                  - "X-Requested-With"
                exposedHeaders:
                  - "Authorization"
                  - "Content-Disposition"
                  - "X-Total-Count"
                  - "X-Tenant-Subdomain"
                  - "Content-Type"
                allowCredentials: true
                maxAge: 86400

      # Dedupe is kept as safety net for double-CORS cases (e.g. dev
      # testing direct-to-service where downstream also adds headers).
      # In normal Gateway-routed flow it is a no-op.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Access-Control-Expose-Headers

server:
  port: ${SERVER_PORT:8070}
  # Bearer tokens carry the full tenant permission catalog (300+ MODULE:ACTION
  # claims ≈ 13KB). Default 8KB header cap answers those requests with 431.
  # (Boot 4 renamed the common key to max-http-request-header-size; the old
  # max-http-header-size is silently ignored, so it is applied explicitly
  # to Netty in NettyHeaderSizeConfig.)
  max-http-request-header-size: 32KB
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEY_PASSWORD:}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:tomcat}

# Multi-tenant domain families (no hardcoded production domains).
#   HCM    : <tenant>.<tenant.base-domain>          e.g. abc.hcm.com
#   CAREER : <tenant>.<tenant.careers-base-domain>  e.g. abc.hcmjobs.com
tenant:
  base-domain: ${TENANT_BASE_DOMAIN:localhost}
  careers-base-domain: ${CAREERS_BASE_DOMAIN:jobs.localhost}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # Default is 30s, which is the exact window that produces
    # "works when I hit :8071 directly, 500s through the :8070 gateway"
    # right after Auth/Employee start up. 5s keeps that window small locally
    # while still being safe to raise via env var in higher environments.
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL:5}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

jwt:
  secret: ${JWT_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkwYWJjZGVmZ2hpamtsbW5vcA==}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: ${HEALTH_DETAILS:when-authorized}
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:DEBUG}
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: ${GATEWAY_ROUTE_LOG_LEVEL:DEBUG}
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: DEBUG
    reactor.netty: ${NETTY_LOG_LEVEL:INFO}
    reactor.netty.http.server: ${NETTY_HTTP_LOG_LEVEL:DEBUG}
  # Production file logging (daily+size rolling, 30-day retention).
  file:
    name: ${LOG_PATH:logs}/${spring.application.name}.log
  pattern:
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [${spring.application.name}] [%thread] %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH:logs}/${spring.application.name}.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      total-size-cap: 2GB
      max-history: 30